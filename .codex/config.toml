# Preferencias reutilizaveis do Codex.
model = "gpt-6-astra"
model_reasoning_effort = "medium"

developer_instructions = '''
## Notion do projeto

A página do KuruHarness no Notion é https://app.notion.com/p/KuruHarness-3faf122a9b1b80ae9badf9f06b1bec16. Por enquanto está vazia.

## Commits por intenção — regra compartilhada com o Cursor

Quando o usuário solicitar criação ou organização de commits, ler e seguir skills/commit/SKILL.md. Analisar todas as alterações pendentes e criar commits coesos por intenção, distinguindo fix, feat e refactor, inclusive quando coexistirem no mesmo arquivo. Manter testes e documentação relacionados junto da mudança, respeitar dependências e conferir o diff preparado antes de cada commit. O pedido autoriza os commits locais; pedidos apenas de análise não autorizam criá-los. Não fazer push nem reescrever o histórico como parte desse fluxo.

## Planejamento — regra exclusiva do Codex

As instruções desta seção se aplicam somente ao Codex.

Ao criar planos, considerar que, dependendo do contexto da tarefa, o **Cursor poderá ser responsável pela implementação**. Não presumir que o próprio Codex executará o plano.

- Escrever planos compreensíveis sem acesso ao histórico da conversa, incluindo objetivo, escopo, decisões relevantes, arquivos envolvidos, etapas e critérios de conclusão, na medida necessária à tarefa.
- Explicitar dependências, pré-requisitos e dúvidas pendentes que afetem a implementação. Referenciar os documentos e artefatos do projeto necessários à execução.
- Quando o contexto indicar implementação pelo Cursor, registrar isso no plano e seguir a convenção do projeto para armazená-lo. No KuruHarness, seguir skills/design/SKILL.md: implementar a UI diretamente no código da aplicação, orientada pelo contexto, sitemap, referências e skills fornecidos pelo usuário. Planos técnicos, quando necessários, ficam na documentação do projeto e referenciam arquivos, rotas e componentes reais.
- Não depender de estado de sessão ou de ferramentas exclusivas do Codex para comunicar instruções ao implementador. Quando uma etapa exigir essas ferramentas, explicitar a dependência e como seu resultado será disponibilizado ao Cursor.
- Se o responsável pela implementação ainda não estiver definido, manter o plano utilizável por ambos os harnesses, sem atribuir a execução automaticamente ao Cursor.
- O usuário valida a UI na aplicação funcionando; aplicar seu feedback diretamente no mesmo código. Não exigir uma etapa prévia de design, Figma, mockups ou HTML separado para aprovação. Sitemap e planejamento devem ser proporcionais ao escopo e não criar etapas obrigatórias de aprovação.
'''

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"

# UI: implementação e validação diretamente na aplicação conforme skills/design/SKILL.md.
